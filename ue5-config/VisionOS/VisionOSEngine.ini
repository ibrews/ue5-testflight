[/Script/Engine.RendererSettings]
; Required for all visionOS projects — app crashes after splash screen without these
vr.InstancedStereo=False
vr.MobileMultiView=False
xr.OpenXRAcquireMode=1

; FXAA anti-aliasing (use MSAA variant if you need higher quality — see VisionOSDeviceProfiles.ini)
r.Mobile.AntiAliasing=1
r.AntiAliasingMethod=1

; ── Mixed immersion (passthrough / AR) ──────────────────────────────────────
; Uncomment the block below for a passthrough experience. For windowed (shared space),
; leave this commented out.
;
;r.Mobile.PropagateAlpha=1
;r.PostProcessing.PropagateAlpha=1
;r.AlphaInvertPass=1
;
;[/Script/VisionOSRuntimeSettings.VisionOSRuntimeSettings]
;ImmersiveStyle=1
