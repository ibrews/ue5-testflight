; Add to your project's Config/DefaultDeviceProfiles.ini
; Removes UE5's iOS FPS cap (default is 30fps / rhi.SyncInterval=2)
;
; NOTE: FrameRateLock=PUFRL_None must also be set in DefaultEngine.ini under
; [/Script/IOSRuntimeSettings.IOSRuntimeSettings] — these CVars alone are not enough.

[/Script/Engine.DeviceProfileManager]
DeviceProfiles=IOS,IOS DeviceProfile

[IOS DeviceProfile]
DeviceType=IOS
BaseProfileName=
+CVars=rhi.SyncInterval=0
+CVars=t.MaxFPS=0
+CVars=r.IOSMaxFPS=120
; r.IOSMaxFPS=120 enables 120Hz on ProMotion devices (iPhone 14 Pro+, iPad Pro)
; On 60Hz devices it has no effect.
