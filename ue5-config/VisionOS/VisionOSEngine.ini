[/Script/Engine.RendererSettings]
; These three settings are required for ALL visionOS projects (prevents crash after splash screen)
vr.InstancedStereo=False
vr.MobileMultiView=False
xr.OpenXRAcquireMode=1

; FXAA anti-aliasing (use instead of MSAA for windowed/shared space)
r.Mobile.AntiAliasing=1
r.AntiAliasingMethod=1

; MIXED IMMERSION — enables passthrough (real world visible behind rendered content)
; Comment out all four lines below to switch to full immersion (dark surround, no passthrough)
r.Mobile.PropagateAlpha=1
r.PostProcessing.PropagateAlpha=1
r.AlphaInvertPass=1

[/Script/VisionOSRuntimeSettings.VisionOSRuntimeSettings]
ImmersiveStyle=1
; ImmersiveStyle=1 = mixed immersion (passthrough), 0 = full immersion (dark)
